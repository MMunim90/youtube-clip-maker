<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>YouTube Clip Maker</title>

    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="container">
      <h1>YouTube Clip Maker</h1>

      <div class="status">
        <span>Status:</span>
        <span id="status">Ready</span>
      </div>

      <div class="recording-time">
        <span>Recording Time:</span>
        <span id="recordingTime">00:00</span>
      </div>

      <div id="conversionProgress" class="conversion-progress">
        <p id="conversionStatus">Converting...</p>

        <p>
          <span id="progressBlocks">░░░░░░░░░░░░░░░░░░░░</span>
          <span id="progressPercentage">0%</span>
        </p>
      </div>

      <button id="detectVideo">Detect YouTube Video</button>

      <div class="video-info">
        <p class="video-title-row">
          <span class="video-label">Video:</span>

          <span class="video-title-container">
            <span id="videoTitle">--</span>
          </span>
        </p>

        <p>
          Duration:
          <span id="duration">--</span>
        </p>

        <p>
          Current Time:
          <span id="currentTime">--</span>
        </p>
      </div>

      <div class="time-section">
        <label for="startTime"> Start Time </label>

        <input type="text" id="startTime" placeholder="01:30" />

        <label for="endTime"> End Time </label>

        <input type="text" id="endTime" placeholder="02:45" />
      </div>

      <div class="recording-type">
        <p>Recording Type</p>

        <label>
          <input type="radio" name="recordingType" value="video" checked />
          Video + Audio
        </label>

        <label>
          <input type="radio" name="recordingType" value="audio" />
          Audio Only
        </label>

        <label>
          <input type="radio" name="recordingType" value="video-only" />
          Video Only
        </label>
      </div>

      <div class="download-type">
        <p>Download Type</p>

        <label>
          <input type="radio" name="downloadType" value="mp4" checked />

          Video (MP4)
        </label>

        <label>
          <input type="radio" name="downloadType" value="mp3" />

          Audio (MP3)
        </label>

        <label>
          <input type="radio" name="downloadType" value="webm" />

          WebM
        </label>
      </div>

      <button id="startRecording">Start Recording</button>

      <button id="stopRecording">Stop Recording</button>

      <button id="pauseRecording">Pause</button>

      <button id="cancelRecording">Cancel</button>
    </div>

    <script type="module" src="popup.js"></script>
    <!-- <script type="module" src="../recorder/recorder.js"></script> -->
  </body>
</html>
